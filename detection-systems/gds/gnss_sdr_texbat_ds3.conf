; =====================================================================
; GNSS-SDR configuration for TEXBAT scenario 3 (Static Matched-Power
; Time Push). For other scenarios, just change SignalSource.filename
; and replace "ds3" in the dump paths. For dynamic scenarios (ds5, ds6, ds8) raise
; Acquisition_1C.doppler_max to 10000.
;
; TEXBAT signal characteristics (Humphreys et al., 2012):
;   - Complex IQ at baseband (L1 = 1575.42 MHz)
;   - 25 Msps sampling rate
;   - 16-bit signed integers, I and Q interleaved
;   - => GNSS-SDR item_type = ishort
; =====================================================================

[GNSS-SDR]

GNSS-SDR.internal_fs_sps=25000000

; ----- Signal source -----
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/path/to/ds3.bin           ; <-- EDIT
SignalSource.item_type=ishort
SignalSource.sampling_frequency=25000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.enable_throttle_control=false

; ----- Signal conditioner -----
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ishort_To_Complex
InputFilter.implementation=Pass_Through
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
Resampler.implementation=Pass_Through
Resampler.sample_freq_in=25000000
Resampler.sample_freq_out=25000000
Resampler.item_type=gr_complex

; ----- Channels -----
Channels_1C.count=10
Channels.in_acquisition=1

; ----- Acquisition -----
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.threshold=2.5
Acquisition_1C.doppler_max=5000                  ; raise to 10000 for ds5/ds6/ds8
Acquisition_1C.doppler_step=250
Acquisition_1C.dump=false

; ----- Tracking (ML-relevant data is produced here) -----
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=30.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.dump=true
Tracking_1C.dump_filename=./outputs/ds3/tracking/trk_ch_   ; <-- EDIT (read by csv_generation.py)

; ----- Telemetry -----
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false

; ----- Observables -----
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=./outputs/ds3/observables/observables.dat   ; <-- EDIT

; ----- PVT (now also dumping NMEA so we can extract per-sample position) -----
PVT.implementation=RTKLIB_PVT
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.dump=true
PVT.dump_filename=./outputs/ds3/pvt           ; <-- EDIT (binary + KML + GeoJSON)
PVT.rinex_version=3

; NMEA output: text file with GGA sentences containing time + lat/lon/alt
; (not used by the detector).
PVT.flag_nmea_tty_port=false
PVT.nmea_dump_filename=./outputs/ds3/pvt.nmea  ; <-- EDIT